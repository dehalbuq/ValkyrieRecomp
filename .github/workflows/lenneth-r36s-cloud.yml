name: Lenneth ARM64 Cloud Lab (dArkOSRE Debian13 profile)
on:
  workflow_dispatch:
  push:
    branches:
      - port/lenneth-cloud-lab
      - port/lenneth-phase34-integration
      - port/lenneth-phase35-dex-audit
      - port/lenneth-phase36-jni-join
      - port/lenneth-phase37-jni-lifecycle
    paths:
      - "lenneth-r36s/**"
      - ".github/workflows/lenneth-r36s-cloud.yml"
permissions:
  contents: read
jobs:
  debian13-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian 13 native ARM64 container (public bootstrap only)
        run: |
          set -euo pipefail
          sh -n lenneth-r36s/cloud/coletar-darkosre.sh
          bash -n lenneth-r36s/cloud/run-tests.sh
          docker build --platform linux/arm64 \
            -f lenneth-r36s/cloud/Dockerfile \
            -t lenneth-debian13:ci lenneth-r36s
      - name: Run synthetic tests with R36S memory and CPU limits, without swap
        run: |
          set -euo pipefail
          mkdir -p cloud-results
          docker run --rm --platform linux/arm64 \
            --cpus 4 --memory 916800k --memory-swap 916800k \
            --pids-limit 256 --network none --read-only \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --volume "$PWD/cloud-results:/results" \
            lenneth-debian13:ci | tee cloud-results/console.log
          grep -q 'CLOUD_DEBIAN13_FINAL=PASS' cloud-results/result.txt
          grep -q 'phase34=PASS' cloud-results/result.txt
          grep -q 'phase35=PASS' cloud-results/result.txt
          grep -q 'phase36=PASS' cloud-results/result.txt
          grep -q 'phase37=PASS' cloud-results/result.txt
          grep -q 'PHASE37_JNI_LIFECYCLE=PASS' cloud-results/phase37.log
          grep -q 'NO_REF_LEAK_AFTER_RESET[[:space:]]*PASS' cloud-results/lenneth-jni-lifecycle37.tsv
          grep -q 'PHASE36_JNI_JOIN=PASS' cloud-results/phase36.log
          grep -q 'PHASE35_DEX_AUDIT=PASS' cloud-results/phase35.log
          grep -q 'GATE.*EXTERNAL_APK.*NOT_PROVIDED' cloud-results/lenneth-dex-contract35.tsv
          grep -q 'JNI_ONLOAD_REGISTER_NATIVES[[:space:]]*PASS' cloud-results/lenneth-jni-integration34.tsv
          grep -q $'^arch\taarch64' cloud-results/environment.tsv
          grep -q $'^glibc\tglibc 2.41' cloud-results/environment.tsv
          grep -q $'^memory_limit_bytes\t938803200' cloud-results/environment.tsv
          grep -q $'^swap_limit_bytes\t0' cloud-results/environment.tsv
          grep -q $'^commercial_engine_executed\tNO' cloud-results/environment.tsv
      - name: Publish sanitized cloud diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lenneth-r36s-debian13-cloud-results
          path: cloud-results/
          if-no-files-found: warn
          retention-days: 14
