# Checks the self-contained R36S software-only OpenGL adapter against the
# pinned PSXRecomp API. Does not compile copyrighted game code and does
# NOT claim that an ARM64 game binary or playable port has been built.
name: R36S software backend API check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'r36s/gpu_gl_stub.c'
      - 'r36s/r36s_exit_menu.cpp'
      - 'r36s/gles-gpu-probe.c'
      - 'r36s/PortMaster/Valkyrie GPU Diagnostic.sh'
      - 'r36s/r36s_exit_menu.h'
      - 'r36s/ValkyrieRecomp.sh'
      - 'r36s/PortMaster/ValkyrieRecomp.sh'
      - 'game.toml'
      - 'CMakeLists.txt'
      - 'r36s/build-*.sh'
      - 'r36s/docker/Dockerfile'
      - 'r36s/patches/**'
      - 'r36s/apply-psxrecomp-patches.sh'
      - '.github/workflows/r36s-source-check.yml'
  push:
    branches:
      - 'r36s/arm64-sdl2-bootstrap'
    paths:
      - 'r36s/gpu_gl_stub.c'
      - 'r36s/r36s_exit_menu.cpp'
      - 'r36s/r36s_exit_menu.h'
      - 'r36s/ValkyrieRecomp.sh'
      - 'r36s/PortMaster/ValkyrieRecomp.sh'
      - 'game.toml'
      - 'r36s/apply-psxrecomp-patches.sh'
      - 'r36s/patches/**'
      - 'CMakeLists.txt'
      - '.github/workflows/r36s-source-check.yml'

permissions:
  contents: read

jobs:
  software-gl-adapter:
    name: Validate C stub against pinned runtime headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install SDL2 developer headers for menu syntax test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libgles2-mesa-dev pkg-config
      - name: Validate submodule pin and headers
        shell: bash
        run: |
          set -euo pipefail
          test -f psxrecomp/runtime/include/gpu_gl_renderer.h
          test -f psxrecomp/runtime/include/gpu_render.h
          git -C psxrecomp rev-parse HEAD
      - name: Verify pinned C11 patch applies and is idempotent
        shell: bash
        run: |
          set -euo pipefail
          bash r36s/apply-psxrecomp-patches.sh
          bash r36s/apply-psxrecomp-patches.sh
          grep -A1 '^retry_candidates:' psxrecomp/runtime/src/overlay_loader.c | grep -q '^    ;'
          # The R36S profile must NOT carry libGLX or libOpenGL links:
          grep -q 'if(NOT VALKYRIE_R36S)' psxrecomp/runtime/runtime.cmake
          grep -q 'target_link_libraries(psx-runtime PRIVATE Threads::Threads)' CMakeLists.txt
          git -C psxrecomp diff --check
      - name: Compile software GL adapter (host syntax only)
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -fsyntax-only -Wall -Wextra -Werror \
              -Ipsxrecomp/runtime/include r36s/gpu_gl_stub.c

      - name: Compile R36S in-game exit menu (SDL2, no game assets)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror \
              $(pkg-config --cflags sdl2) r36s/r36s_exit_menu.cpp
          gcc -std=c11 -fsyntax-only -Wall -Wextra -Werror \
              $(pkg-config --cflags sdl2) r36s/gles-gpu-probe.c
          grep -q 'effective_fps=' r36s/r36s_exit_menu.cpp
          grep -q 'PSX_IDLE_SKIP=' r36s/ValkyrieRecomp.sh
          python3 -m py_compile r36s/patches/r36s-main-hooks.py
          grep -q 'r36s_exit_menu_tick();' psxrecomp/runtime/src/main.cpp
          grep -q 'r36s_exit_menu_draw(sdl_renderer' psxrecomp/runtime/src/main.cpp
          grep -q 'r36s_install_fallback_gamepad_maps();' psxrecomp/runtime/src/main.cpp
          grep -q 'default_p1_device = "auto"' game.toml
          grep -q 'r36s_exit_menu.cpp' CMakeLists.txt

      - name: Check launcher and build script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n r36s/build-r36s.sh r36s/build-docker.sh \
                  r36s/build-arm64-in-docker.sh r36s/apply-psxrecomp-patches.sh
          bash -n r36s/PortMaster/"Valkyrie GPU Diagnostic.sh"\n          bash -n r36s/ValkyrieRecomp.sh
          sh -n r36s/PortMaster/ValkyrieRecomp.sh r36s/collect-system-info.sh
          python3 -m json.tool CMakePresets.json >/dev/null
      - name: Verify intended backend selection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'list(REMOVE_ITEM PSXRECOMP_RUNTIME_SOURCES' CMakeLists.txt
          grep -q 'gpu_gl_stub.c' CMakeLists.txt
          grep -q 'PSXRECOMP_REQUIRE_GAME_C ON' CMakeLists.txt
          grep -q 'OUTPUT_NAME "ValkyrieRecomp"' CMakeLists.txt
