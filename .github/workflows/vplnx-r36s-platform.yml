name: Lenneth vpl_nx Linux ARM64 platform
on:
  workflow_dispatch:
  push:
    branches:
      - port/lenneth-vplnx-linux-arm64
      - port/lenneth-vplnx-linux-arm64-loader
    paths:
      - "vplnx-r36s/**"
      - ".github/workflows/vplnx-r36s-platform.yml"
permissions:
  contents: read
jobs:
  platform-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native AArch64 Linux SDL2/EGL/GLES development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libsdl2-dev libgles2-mesa-dev \
            libegl-dev xvfb xauth mesa-utils file binutils
      - name: Build native Linux ARM64 backend for vpl_nx
        run: |
          set -euo pipefail
          python3 -m py_compile vplnx-r36s/tools/audit_vplnx_elf.py
          cmake -S vplnx-r36s -B build-vplnx-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vplnx-linux --parallel 4
          file build-vplnx-linux/vplnx-linux-platform-check
          readelf -h build-vplnx-linux/vplnx-linux-platform-check | grep -q 'Machine:.*AArch64'
      - name: Exercise Linux EGL/GLES2 context without any game code
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          timeout 30 xvfb-run -a -s "-screen 0 800x600x24" \
            ./build-vplnx-linux/vplnx-linux-platform-check > platform.log 2>&1
          cat platform.log
          grep -q 'VPLNX_LINUX_PLATFORM=PASS commercial_engine=NOT_EXECUTED' platform.log
          grep -Eq 'GLES: .*OpenGL ES' platform.log
      - name: Link real AArch64 ELF structures across two independent public test libraries
        run: |
          set -euo pipefail
          cat > /tmp/vplnx-test-cxx.c <<'EOF'
          static int state = 37;
          int *vpl_partner_relative = &state;
          __attribute__((visibility("default"))) int vpl_partner_api(void) {
            return *vpl_partner_relative;
          }
          EOF
          cat > /tmp/vplnx-test-game.c <<'EOF'
          extern int vpl_partner_api(void);
          static int state = 40;
          int *vpl_game_relative = &state;
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *r) {
            (void)vm;(void)r;
            return vpl_partner_api()+*vpl_game_relative;
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeInit(void *env,void *c,int w,int h) {
            (void)env;(void)c;(void)w;(void)h;
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeRender(void *env,void *c) {
            (void)env;(void)c;
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxHelper_nativeSetContext(void *env,void *c,void *ctx,void *manager) {
            (void)env;(void)c;(void)ctx;(void)manager;
          }
          EOF
          cc -shared -fPIC -nostdlib -Wl,-z,now -Wl,-z,relro -o /tmp/vplnx-cxx.so /tmp/vplnx-test-cxx.c
          cc -shared -fPIC -nostdlib -Wl,-z,now -Wl,-z,relro -o /tmp/vplnx-game.so /tmp/vplnx-test-game.c
          readelf -h /tmp/vplnx-game.so | grep -q 'Machine:.*AArch64'
          ./build-vplnx-linux/vplnx-linux-elf-check /tmp/vplnx-game.so /tmp/vplnx-cxx.so \
            | tee elf-integration.log
          grep -q 'VPLNX_ELF_PREFLIGHT=PASS' elf-integration.log
          grep -q 'MEMORY_PROTECTION=PASS W_X=ENFORCED' elf-integration.log
          grep -q 'JNI_EXPORTS=4/4' elf-integration.log
          grep -q 'NEXT_GATE=READY_FOR_SEPARATE_JNI_ABI_TEST' elf-integration.log
          grep -q 'COMMERCIAL_ENGINE=NOT_EXECUTED' elf-integration.log
          grep -Eq 'resolved=[1-9][0-9]*' elf-integration.log
          if ./build-vplnx-linux/vplnx-linux-elf-check /etc/os-release /tmp/vplnx-cxx.so; then
            echo 'FAIL: non-ELF input accepted'
            exit 1
          fi
          cat > /tmp/vplnx-unresolved.c <<'EOF'
          extern int unknown_android_symbol(void);
          int JNI_OnLoad(void *vm,void *r) {
            (void)vm;(void)r;
            return unknown_android_symbol();
          }
          EOF
          cc -shared -fPIC -nostdlib -Wl,-z,now -o /tmp/vplnx-unresolved.so /tmp/vplnx-unresolved.c
          ./build-vplnx-linux/vplnx-linux-elf-check /tmp/vplnx-unresolved.so /tmp/vplnx-cxx.so \
            | tee elf-blocked.log
          grep -q 'NEXT_GATE=BLOCKED_MISSING_HOST_OR_JNI_SERVICES' elf-blocked.log
          grep -q 'COMMERCIAL_ENGINE=NOT_EXECUTED' elf-blocked.log
      - name: Linux Android assets bridge - 350 MB sparse CPK streaming, traversal denial
        run: |
          set -euo pipefail
          mkdir -p /tmp/vplnx-assets/nested
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/vplnx-assets/discData.cpk")
          with p.open("wb") as f:
              f.seek(350_000_000)
              f.write(b"CPK!")
          Path("/tmp/vplnx-assets/nested/ok.txt").write_bytes(b"OK")
          PY
          ln -s /etc/passwd /tmp/vplnx-assets/link-passwd
          ln -s /etc /tmp/vplnx-assets/link-dir
          ./build-vplnx-linux/vplnx-linux-assets-check /tmp/vplnx-assets \
            | tee assets-stream.log
          grep -q 'VPLNX_ASSET_STREAM=PASS' assets-stream.log
          grep -q 'symlink_denial=PASS traversal_denial=PASS' assets-stream.log
          grep -q 'commercial_assets=NONE' assets-stream.log
      - name: Publish open-source platform binary and non-sensitive logs
        uses: actions/upload-artifact@v4
        with:
          name: vplnx-linux-arm64-platform-only
          path: |
            build-vplnx-linux/vplnx-linux-platform-check
            platform.log
            elf-integration.log
            elf-blocked.log
            assets-stream.log
          if-no-files-found: error
          retention-days: 14
