name: Lenneth vpl_nx Linux ARM64 platform
on:
  workflow_dispatch:
  push:
    branches:
      - port/lenneth-vplnx-linux-arm64
      - port/lenneth-vplnx-linux-arm64-loader
    paths:
      - "vplnx-r36s/**"
      - ".github/workflows/vplnx-r36s-platform.yml"
permissions:
  contents: read
jobs:
  platform-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native AArch64 Linux SDL2/EGL/GLES development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libsdl2-dev libgles2-mesa-dev \
            libegl-dev xvfb xauth mesa-utils file binutils zip unzip
      - name: Build native Linux ARM64 backend for vpl_nx
        run: |
          set -euo pipefail
          python3 -m py_compile vplnx-r36s/tools/audit_vplnx_elf.py
          cmake -S vplnx-r36s -B build-vplnx-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vplnx-linux --parallel 4
          file build-vplnx-linux/vplnx-linux-platform-check
          readelf -h build-vplnx-linux/vplnx-linux-platform-check | grep -q 'Machine:.*AArch64'
      - name: Exercise Linux EGL/GLES2 context without any game code
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          timeout 30 xvfb-run -a -s "-screen 0 800x600x24" \
            ./build-vplnx-linux/vplnx-linux-platform-check > platform.log 2>&1
          cat platform.log
          grep -q 'VPLNX_LINUX_PLATFORM=PASS commercial_engine=NOT_EXECUTED' platform.log
          grep -Eq 'GLES: .*OpenGL ES' platform.log
      - name: Link real AArch64 ELF structures across two independent public test libraries
        run: |
          set -euo pipefail
          cat > /tmp/vplnx-test-cxx.c <<'EOF'
          static int state = 37;
          int *vpl_partner_relative = &state;
          __attribute__((visibility("default"))) int vpl_partner_api(void) {
            return *vpl_partner_relative;
          }
          EOF
          cat > /tmp/vplnx-test-game.c <<'EOF'
          extern int vpl_partner_api(void);
          static int state = 40;
          int *vpl_game_relative = &state;
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *r) {
            (void)vm;(void)r;
            return vpl_partner_api()+*vpl_game_relative;
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeInit(void *env,void *c,int w,int h) {
            (void)env;(void)c;(void)w;(void)h;
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeRender(void *env,void *c) {
            (void)env;(void)c;
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxHelper_nativeSetContext(void *env,void *c,void *ctx,void *manager) {
            (void)env;(void)c;(void)ctx;(void)manager;
          }
          EOF
          cc -shared -fPIC -nostdlib -Wl,-z,now -Wl,-z,relro -o /tmp/vplnx-cxx.so /tmp/vplnx-test-cxx.c
          cc -shared -fPIC -nostdlib -Wl,-z,now -Wl,-z,relro -o /tmp/vplnx-game.so /tmp/vplnx-test-game.c
          readelf -h /tmp/vplnx-game.so | grep -q 'Machine:.*AArch64'
          ./build-vplnx-linux/vplnx-linux-elf-check /tmp/vplnx-game.so /tmp/vplnx-cxx.so \
            | tee elf-integration.log
          grep -q 'VPLNX_ELF_PREFLIGHT=PASS' elf-integration.log
          grep -q 'MEMORY_PROTECTION=PASS W_X=ENFORCED' elf-integration.log
          grep -q 'JNI_EXPORTS=4/4' elf-integration.log
          grep -q 'NEXT_GATE=READY_FOR_SEPARATE_JNI_ABI_TEST' elf-integration.log
          grep -q 'COMMERCIAL_ENGINE=NOT_EXECUTED' elf-integration.log
          grep -Eq 'resolved=[1-9][0-9]*' elf-integration.log
          if ./build-vplnx-linux/vplnx-linux-elf-check /etc/os-release /tmp/vplnx-cxx.so; then
            echo 'FAIL: non-ELF input accepted'
            exit 1
          fi
          cat > /tmp/vplnx-unresolved.c <<'EOF'
          extern int unknown_android_symbol(void);
          int JNI_OnLoad(void *vm,void *r) {
            (void)vm;(void)r;
            return unknown_android_symbol();
          }
          EOF
          cc -shared -fPIC -nostdlib -Wl,-z,now -o /tmp/vplnx-unresolved.so /tmp/vplnx-unresolved.c
          ./build-vplnx-linux/vplnx-linux-elf-check /tmp/vplnx-unresolved.so /tmp/vplnx-cxx.so \
            | tee elf-blocked.log
          grep -q 'NEXT_GATE=BLOCKED_MISSING_HOST_OR_JNI_SERVICES' elf-blocked.log
          grep -q 'COMMERCIAL_ENGINE=NOT_EXECUTED' elf-blocked.log
      - name: Linux Android assets bridge - 350 MB sparse CPK streaming, traversal denial
        run: |
          set -euo pipefail
          mkdir -p /tmp/vplnx-assets/nested
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/vplnx-assets/discData.cpk")
          with p.open("wb") as f:
              f.seek(350_000_000)
              f.write(b"CPK!")
          Path("/tmp/vplnx-assets/nested/ok.txt").write_bytes(b"OK")
          PY
          ln -s /etc/passwd /tmp/vplnx-assets/link-passwd
          ln -s /etc /tmp/vplnx-assets/link-dir
          ./build-vplnx-linux/vplnx-linux-assets-check /tmp/vplnx-assets \
            | tee assets-stream.log
          grep -q 'VPLNX_ASSET_STREAM=PASS' assets-stream.log
          grep -q 'symlink_denial=PASS traversal_denial=PASS' assets-stream.log
          grep -q 'commercial_assets=NONE' assets-stream.log
      - name: Ported vpl_nx OpenSL ES SDL2 mixer - dummy audio AArch64
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          timeout 30 ./build-vplnx-linux/vplnx-linux-audio-check > audio-opensles.log 2>&1
          cat audio-opensles.log
          grep -q 'VPLNX_OPENSL=PASS' audio-opensles.log
          grep -q 'callback_drained=1' audio-opensles.log
          grep -q 'commercial_engine=NO' audio-opensles.log
      - name: Linux Cocos2d JNI/JavaVM and AAsset native services synthetic test
        run: |
          set -euo pipefail
          mkdir -p /tmp/vplnx-jni-assets
          printf 'SYNTHJNI' > /tmp/vplnx-jni-assets/sample.bin
          timeout 30 ./build-vplnx-linux/vplnx-linux-jni-check /tmp/vplnx-jni-assets \
            | tee jni-abi.log
          grep -q 'VPLNX_JNI_ABI=PASS' jni-abi.log
          grep -q 'VPLNX_JNI_ASSETS=PASS' jni-abi.log
          grep -q 'VPLNX_JNI_FAIL_CLOSED=PASS' jni-abi.log
          grep -q 'RegisterNatives=UNIMPLEMENTED' jni-abi.log
          grep -q 'VPLNX_JNI_GAME_EXECUTED=NO' jni-abi.log
      - name: Bionic host services mapped into AArch64 ELF (no guest code)
        run: |
          set -euo pipefail
          ./build-vplnx-linux/vplnx-linux-host-check --host-selftest | tee bionic-host-selftest.log
          grep -q 'BIONIC_HOST_SELFTEST=PASS' bionic-host-selftest.log
          grep -q 'pthread_layout=BLOCKED file_layout=BLOCKED' bionic-host-selftest.log
          cat > /tmp/vplnx-bionic-partner.c <<'EOF'
          int vpl_partner_api(void) {return 12;}
          EOF
          cat > /tmp/vplnx-bionic-guest.c <<'EOF'
          #include <stddef.h>
          extern int vpl_partner_api(void);
          extern void *AAssetManager_open(void *,const char *,int);
          extern int __android_log_write(int,const char*,const char*);
          extern int *__errno(void);
          extern void glClear(unsigned int);
          extern void *SL_IID_ENGINE;
          extern void *memcpy(void*,const void*,size_t);
          volatile void *bionic_open= (void *)&AAssetManager_open;
          volatile void *bionic_gl= (void *)&glClear;
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *u) {
              (void)vm;(void)u;
              char dst[8]={0};
              memcpy(dst,"abc",4);
              int *err=__errno();
              __android_log_write(3,"synthetic","not executed");
              return vpl_partner_api()+(err!=0)+(SL_IID_ENGINE!=0);
          }
          EOF
          cc -shared -fPIC -nostdlib -fno-builtin -Wl,-z,now \
            -o /tmp/vplnx-bionic-partner.so /tmp/vplnx-bionic-partner.c
          cc -shared -fPIC -nostdlib -fno-builtin -Wl,-z,now \
            -o /tmp/vplnx-bionic-guest.so /tmp/vplnx-bionic-guest.c
          readelf -h /tmp/vplnx-bionic-guest.so | grep -q 'Machine:.*AArch64'
          ./build-vplnx-linux/vplnx-linux-host-check \
            /tmp/vplnx-bionic-guest.so /tmp/vplnx-bionic-partner.so \
            | tee bionic-host-linked.log
          grep -q 'BIONIC_HOST_LINK=PASS' bionic-host-linked.log
          grep -Eq 'host_slots=[1-9][0-9]*' bionic-host-linked.log
          grep -q 'MEMORY_PROTECTION=PASS W_X=ENFORCED' bionic-host-linked.log
          grep -q 'COMMERCIAL_ENGINE_EXECUTED=NO' bionic-host-linked.log
          cat > /tmp/vplnx-bionic-unsafe.c <<'EOF'
          extern int pthread_create(void *,const void *,void *(*)(void *),void *);
          int JNI_OnLoad(void *vm,void *u) {
              (void)vm;(void)u;
              return pthread_create((void *)0,(void *)0,(void *)0,(void *)0);
          }
          EOF
          cc -shared -fPIC -nostdlib -Wl,-z,now \
            -o /tmp/vplnx-bionic-unsafe.so /tmp/vplnx-bionic-unsafe.c
          ./build-vplnx-linux/vplnx-linux-host-check \
            /tmp/vplnx-bionic-unsafe.so /tmp/vplnx-bionic-partner.so \
            | tee bionic-host-blocked.log
          grep -q 'BIONIC_HOST_LINK=BLOCKED' bionic-host-blocked.log
          grep -q 'MEMORY_PROTECTION=BLOCKED' bionic-host-blocked.log
          grep -q 'COMMERCIAL_ENGINE_EXECUTED=NO' bionic-host-blocked.log
      - name: Android LP64 40/48-byte mutex and cond ABI bridge regression
        run: |
          set -euo pipefail
          ./build-vplnx-linux/vplnx-bionic-pthread-check | tee bionic-pthread.log
          grep -q 'BIONIC_PTHREAD_ABI=PASS guest_mutex_bytes=40 guest_cond_bytes=48' bionic-pthread.log
          grep -q 'BIONIC_PTHREAD_LIFECYCLE=PASS' bionic-pthread.log
          grep -q 'COMMERCIAL_ENGINE_EXECUTED=NO' bionic-pthread.log
          cat > /tmp/vplnx-guest-mutex.c <<'EOF'
          struct android_mutex { unsigned state; char reserved[36]; };
          struct android_cond { unsigned state; char reserved[44]; };
          extern int pthread_mutex_lock(struct android_mutex *);
          extern int pthread_mutex_unlock(struct android_mutex *);
          extern int pthread_cond_signal(struct android_cond *);
          static struct android_mutex mutex;
          static struct android_cond cond;
          int JNI_OnLoad(void *vm,void *unused) {
              (void)vm; (void)unused;
              /* Synthetic ELF only, never executed by link validator. */
              return pthread_mutex_lock(&mutex)+pthread_cond_signal(&cond)+
                     pthread_mutex_unlock(&mutex);
          }
          EOF
          cc -shared -fPIC -nostdlib -Wl,-z,now \
            -o /tmp/vplnx-guest-mutex.so /tmp/vplnx-guest-mutex.c
          ./build-vplnx-linux/vplnx-linux-host-check \
            /tmp/vplnx-guest-mutex.so /tmp/vplnx-bionic-partner.so \
            | tee bionic-pthread-imports.log
          grep -q 'BIONIC_HOST_LINK=PASS' bionic-pthread-imports.log
          grep -Eq 'host_slots=[1-9][0-9]*' bionic-pthread-imports.log

      - name: Bionic FORTIFY checked-buffer and wchar ARM64 regression
        run: |
          set -euo pipefail
          timeout 30 ./build-vplnx-linux/vplnx-bionic-fortify-check \
            > bionic-fortify.log 2>&1
          cat bionic-fortify.log
          grep -q 'VPLNX_BIONIC_FORTIFY=PASS' bionic-fortify.log
          grep -q 'violations=ABORT' bionic-fortify.log
          grep -q 'COMMERCIAL_ENGINE_EXECUTED=NO' bionic-fortify.log
          cat > /tmp/vplnx-fortify-guest.c <<'EOF'
          #include <stddef.h>
          extern char *__strcat_chk(char *, const char *, size_t);
          extern char *__strncpy_chk(char *, const char *, size_t, size_t);
          extern int __vsnprintf_chk(char *, size_t, int, size_t,
                                     const char *, void *);
          extern double wcstod(const unsigned int *, unsigned int **);
          static volatile void *refs[] = {
              (void *)&__strcat_chk, (void *)&__strncpy_chk,
              (void *)&__vsnprintf_chk, (void *)&wcstod
          };
          int JNI_OnLoad(void *vm,void *u) {
              (void)vm;(void)u;
              return refs[0]!=0;
          }
          EOF
          cc -shared -fPIC -nostdlib -Wl,-z,now \
            -o /tmp/vplnx-fortify-guest.so /tmp/vplnx-fortify-guest.c
          ./build-vplnx-linux/vplnx-linux-host-check \
            /tmp/vplnx-fortify-guest.so /tmp/vplnx-bionic-partner.so \
            | tee bionic-fortify-imports.log
          grep -q 'BIONIC_HOST_LINK=PASS' bionic-fortify-imports.log
          grep -q 'COMMERCIAL_ENGINE_EXECUTED=NO' bionic-fortify-imports.log

      - name: Cloud-only synthetic ARM64 guest executes JNI_OnLoad through ELF/JNI/Bionic
        run: |
          set -euo pipefail
          cc -shared -fPIC -nostdlib -fno-stack-protector -fno-builtin \
            -Wl,-z,now -Wl,-z,relro \
            -o /tmp/vplnx-ci-synthetic-partner.so \
            vplnx-r36s/tests/synthetic_partner.c
          cc -shared -fPIC -nostdlib -fno-stack-protector -fno-builtin \
            -Wl,-z,now -Wl,-z,relro \
            -o /tmp/vplnx-ci-synthetic-guest.so \
            vplnx-r36s/tests/synthetic_guest.c
          readelf -h /tmp/vplnx-ci-synthetic-guest.so | grep -q 'Machine:.*AArch64'
          timeout 15 ./build-vplnx-linux/vplnx-cloud-synthetic-boot \
            /tmp/vplnx-ci-synthetic-guest.so \
            /tmp/vplnx-ci-synthetic-partner.so \
            > synthetic-arm64-boot.log 2>&1
          cat synthetic-arm64-boot.log
          grep -q 'SYNTHETIC_ARM64_JNI_ONLOAD=PASS' synthetic-arm64-boot.log
          grep -q 'SYNTHETIC_ARM64_ISOLATION=PASS' synthetic-arm64-boot.log
          grep -q 'COMMERCIAL_ENGINE_EXECUTED=NO' synthetic-arm64-boot.log
          # A swapped/invalid fixture must NEVER be executed.
          if timeout 10 ./build-vplnx-linux/vplnx-cloud-synthetic-boot \
              /tmp/vplnx-ci-synthetic-partner.so \
              /tmp/vplnx-ci-synthetic-guest.so \
              > synthetic-arm64-reject.log 2>&1; then
            echo "FAIL: unexpected accepted fixture"
            exit 1
          fi
          grep -q 'SYNTHETIC_GUEST=BLOCKED' synthetic-arm64-reject.log
          # Repeated independently forked ELF + JNI start/finish cycles.
          for n in $(seq 1 100); do
            timeout 10 ./build-vplnx-linux/vplnx-cloud-synthetic-boot \
              /tmp/vplnx-ci-synthetic-guest.so \
              /tmp/vplnx-ci-synthetic-partner.so \
              >/dev/null 2>&1
          done
          echo 'SYNTHETIC_ARM64_STRESS=PASS iterations=100' | tee synthetic-arm64-stress.log

      - name: Cloud 128-case deterministic malformed AArch64 ELF rejection
        run: |
          set -euo pipefail
          python3 vplnx-r36s/tests/cloud_elf_adversarial.py \
            --elf-check ./build-vplnx-linux/vplnx-linux-elf-check \
            --guest /tmp/vplnx-ci-synthetic-guest.so \
            --partner /tmp/vplnx-ci-synthetic-partner.so \
            --cases 128 | tee cloud-elf-adversarial.log
          grep -q 'CLOUD_ELF_MUTATION=PASS' cloud-elf-adversarial.log
          grep -q 'accepted=0 crashes=0 timeouts=0' cloud-elf-adversarial.log

      - name: Ensure R36S diagnostic creates logs before any native binary is present
        run: |
          set -euo pipefail
          sh -n vplnx-r36s/PortMaster/run-r36s-diagnostico.sh
          sh -n "vplnx-r36s/PortMaster/VPLNX R36S Diagnostico.sh"
          mkdir -p /tmp/vplnx-r36s-smoke
          cp vplnx-r36s/PortMaster/run-r36s-diagnostico.sh /tmp/vplnx-r36s-smoke/
          (cd /tmp && /bin/sh /tmp/vplnx-r36s-smoke/run-r36s-diagnostico.sh)
          test -s /tmp/vplnx-r36s-smoke/VPLNX_R36S_INICIO.log
          test -s /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS.tar.gz
          tar -tzf /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS.tar.gz | grep -q '/resumo.txt'
          tar -xOzf /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS.tar.gz \
            --wildcards '*/resumo.txt' | grep -q 'STATUS=BINARIOS_AUSENTES'
          # Run again: ensure the previous valid tarball is backed up, never
          # replaced in-place or truncated by a new attempt.
          (cd /tmp && /bin/sh /tmp/vplnx-r36s-smoke/run-r36s-diagnostico.sh)
          test -s /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS_ANTERIOR.tar.gz
          tar -tzf /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS_ANTERIOR.tar.gz | grep -q 'resumo.txt'
          # Simulate one native test and confirm completed results are embedded.
          mkdir -p /tmp/vplnx-r36s-smoke/bin
          cat > /tmp/vplnx-r36s-smoke/bin/vplnx-bionic-pthread-check <<'EOF'
          #!/bin/sh
          printf 'BIONIC_PTHREAD_ABI=PASS guest_mutex_bytes=40 guest_cond_bytes=48\n'
          EOF
          chmod 755 /tmp/vplnx-r36s-smoke/bin/vplnx-bionic-pthread-check
          (cd /tmp && /bin/sh /tmp/vplnx-r36s-smoke/run-r36s-diagnostico.sh)
          tar -xOzf /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS.tar.gz \
            --wildcards '*/resultados.tsv' | grep -q 'PTHREAD_BIONIC_ABI'
          tar -xOzf /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS.tar.gz \
            --wildcards '*/resumo.txt' | grep -q 'STATUS=FINISHED'
          test -s /tmp/vplnx-r36s-smoke/VPLNX_R36S_DIAGNOSTICOS_ANTERIOR.tar.gz
          echo "R36S_ATOMIC_SNAPSHOTS=PASS previous_valid=1 current_valid=1"
          echo "R36S_FAILSAFE_LOGS=PASS"

      - name: Assemble complete R36S Ports diagnostic zip without commercial files
        run: |
          set -euo pipefail
          mkdir -p r36s-pkg/ports/vplnx-r36s/bin
          for f in platform audio jni elf host; do
            install -m755 "build-vplnx-linux/vplnx-linux-$f-check" \
              "r36s-pkg/ports/vplnx-r36s/bin/vplnx-linux-$f-check"
          done
          install -m755 build-vplnx-linux/vplnx-bionic-pthread-check \
            r36s-pkg/ports/vplnx-r36s/bin/vplnx-bionic-pthread-check
          install -m755 build-vplnx-linux/vplnx-bionic-fortify-check \
            r36s-pkg/ports/vplnx-r36s/bin/vplnx-bionic-fortify-check
          install -m755 vplnx-r36s/PortMaster/run-r36s-diagnostico.sh \
            r36s-pkg/ports/vplnx-r36s/run-r36s-diagnostico.sh
          install -m755 "vplnx-r36s/PortMaster/VPLNX R36S Diagnostico.sh" \
            "r36s-pkg/ports/VPLNX R36S Diagnostico.sh"
          install -m644 vplnx-r36s/PortMaster/LEIA-ME-R36S-PTBR.txt \
            r36s-pkg/ports/vplnx-r36s/LEIA-ME-R36S-PTBR.txt
          if find r36s-pkg -type f \( -name 'libMyGame.so' \
              -o -name 'libc++_shared.so' -o -name 'libRMS.so' \
              -o -name '*.cpk' \) | grep -q .; then
              echo 'ERROR: proprietary game data in diagnostics package'
              exit 1
          fi
          (cd r36s-pkg && zip -qr ../VPLNX-R36S-DIAGNOSTICO-ARM64.zip ports)
          unzip -Z -1 VPLNX-R36S-DIAGNOSTICO-ARM64.zip | tee r36s-package-list.txt
          grep -q 'ports/vplnx-r36s/bin/vplnx-linux-host-check' r36s-package-list.txt
          grep -q 'ports/vplnx-r36s/bin/vplnx-bionic-pthread-check' r36s-package-list.txt
          grep -q 'ports/vplnx-r36s/bin/vplnx-bionic-fortify-check' r36s-package-list.txt
          grep -q 'ports/VPLNX R36S Diagnostico.sh' r36s-package-list.txt
          for f in r36s-pkg/ports/vplnx-r36s/bin/*; do
            file "$f" | grep -q 'ARM aarch64'
          done
          sha256sum VPLNX-R36S-DIAGNOSTICO-ARM64.zip | tee r36s-package-sha256.txt
          ls -lh VPLNX-R36S-DIAGNOSTICO-ARM64.zip

      - name: Publish PortMaster R36S installation package
        uses: actions/upload-artifact@v4
        with:
          name: VPLNX-R36S-DIAGNOSTICO-ARM64
          path: VPLNX-R36S-DIAGNOSTICO-ARM64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish open-source platform binary and non-sensitive logs
        uses: actions/upload-artifact@v4
        with:
          name: vplnx-linux-arm64-platform-only
          path: |
            build-vplnx-linux/vplnx-linux-platform-check
            platform.log
            elf-integration.log
            elf-blocked.log
            assets-stream.log
            audio-opensles.log
            jni-abi.log
            bionic-host-selftest.log
            bionic-host-linked.log
            bionic-host-blocked.log
            bionic-pthread.log
            bionic-pthread-imports.log
            bionic-fortify.log
            bionic-fortify-imports.log
            synthetic-arm64-boot.log
            synthetic-arm64-reject.log
            synthetic-arm64-stress.log
            cloud-elf-adversarial.log
          if-no-files-found: error
          retention-days: 14
