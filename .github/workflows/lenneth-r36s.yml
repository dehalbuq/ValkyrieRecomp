          grep -q 'directory_sandbox=PASS' lenneth-phase17-fixture.txt
          grep -q 'locale_t_mbstate_t=UNMAPPED' lenneth-phase17-fixture.txt
          cat > /tmp/lenneth_phase17_mock.c <<'EOF'
          #include <stdint.h>
