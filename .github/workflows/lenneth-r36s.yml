      - name: Phase14 opaque Bionic FILE shim and fortified printf ABI multitest
        run: |
          ./build-lenneth/lenneth-probe --stdio-selftest | tee lenneth-stdio-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-stdio-fixture.txt
          grep -q 'legacy___sF_NOT_MAPPED=1' lenneth-stdio-fixture.txt

          cat > /tmp/lenneth_phase14_mock.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          #include <string.h>
          extern unsigned char __sF[];
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *reserved) {
            (void)vm;(void)reserved;
            FILE *file=fopen("assets/test.bin","rb");
            char buf[64]={0};
            if(file){
              fread(buf,1,4,file);
              fseek(file,0,SEEK_SET);
              clearerr(file);
              fclose(file);
            }
            file=fopen("saves/progress.dat","wb");
            if(file) {
              fprintf(file,"value=%d",77);
              fflush(file);
              fclose(file);
            }
            return (int)__sF[0]; /* intentionally UNRESOLVED Bionic data */
          }
          EOF
          cc -shared -fPIC -O2 -fno-builtin -o /tmp/phase14_game.so /tmp/lenneth_phase14_mock.c
          mkdir -p assets saves
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase14_game.so /tmp/phase3_partner.so | tee lenneth-phase14-batch-test.txt
          grep -q 'PHASE14_LINK=PASS' lenneth-phase14-batch-test.txt
          grep -Eq 'host_stdio_slots=[1-9][0-9]*' lenneth-phase14-batch-test.txt
          grep -q 'Experimental opaque Bionic FILE API synthetic fixture: PASS' lenneth-suite-summary.txt
          grep -q 'FINAL=PASS' lenneth-phase14-batch-test.txt
          grep -q '__sF' lenneth-blockers.tsv
          if ./build-lenneth/lenneth-probe --batch-headless /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid ELF accepted by phase14"
            exit 1
          fi

      - name: Phase15 test OpenSL ES IID data and typed audio engine interface ABI
        run: |
          ./build-lenneth/lenneth-probe --opensl-selftest | tee lenneth-opensl-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-opensl-fixture.txt
          grep -q 'iid_data_symbols=4' lenneth-opensl-fixture.txt
          grep -q 'real_pcm_output=NOT_IMPLEMENTED' lenneth-opensl-fixture.txt

          cat > /tmp/lenneth_phase15_mock.c <<'EOF'
          #include <stdint.h>
          extern const void *SL_IID_ENGINE;
          extern const void *SL_IID_PLAY;
          extern const void *SL_IID_BUFFERQUEUE;
          extern const void *SL_IID_VOLUME;
          extern unsigned slCreateEngine(void *, unsigned, void *,
                                         unsigned, void *, void *);
          __attribute__((visibility("default")))
          int JNI_OnLoad(void *vm,void *reserved) {
            (void)vm;(void)reserved;
            volatile const void *p1=SL_IID_ENGINE;
            volatile const void *p2=SL_IID_PLAY;
            volatile const void *p3=SL_IID_BUFFERQUEUE;
            volatile const void *p4=SL_IID_VOLUME;
            return (p1!=0)+(p2!=0)+(p3!=0)+(p4!=0)+
                   (int)slCreateEngine(0,0,0,0,0,0);
          }
          EOF
          cc -shared -fPIC -O2 -fno-builtin -o /tmp/phase15_game.so /tmp/lenneth_phase15_mock.c
          mkdir -p assets saves
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase15_game.so /tmp/phase3_partner.so | tee lenneth-phase15-batch-test.txt
          grep -q 'PHASE15_LINK=PASS' lenneth-phase15-batch-test.txt
          grep -Eq 'host_opensl_slots=[1-9][0-9]*' lenneth-phase15-batch-test.txt
          grep -Eq 'opensl_abi_shims=[1-9][0-9]*' lenneth-phase15-batch-test.txt
          grep -q 'OpenSL ES engine/PCM queue/IID ABI synthetic fixture: PASS' lenneth-suite-summary.txt
          grep -q 'OpenSL actual PCM sound output: NOT_IMPLEMENTED' lenneth-suite-summary.txt
          grep -q 'FINAL=PASS' lenneth-phase15-batch-test.txt
          # Confirm no extra imports or data-type confusion are mapped.
          if grep -E 'SL_IID_(ENGINE|PLAY|BUFFERQUEUE|VOLUME)|slCreateEngine' lenneth-blockers.tsv; then
            echo "ERROR: required OpenSL symbols were left unresolved"
            exit 1
          fi
          if ./build-lenneth/lenneth-probe --batch-headless /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: malformed ELF accepted by phase15"
            exit 1
