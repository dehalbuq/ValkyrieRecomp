      - name: Phase18 Bionic locale and UTF8 conversion grouped ABI fixtures
        run: |
          ./build-lenneth/lenneth-probe --locale18-selftest | tee lenneth-phase18-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-phase18-fixture.txt
          grep -q 'mapped_symbols=17' lenneth-phase18-fixture.txt
          grep -q 'guest_mbstate_bytes=8' lenneth-phase18-fixture.txt
          grep -q 'locale_host_isolated=1' lenneth-phase18-fixture.txt
          cat > /tmp/lenneth_phase18_mock.c <<'EOF'
          #include <stddef.h>
          #include <stdint.h>
          #include <wchar.h>
          extern unsigned char __sF[];
          extern void *newlocale(int, const char *, void *);
          extern void freelocale(void *);
          extern void *uselocale(void *);
          extern char *setlocale(int, const char *);
          extern long long strtoll_l(const char *, char **, int, void *);
          extern unsigned long long strtoull_l(const char *, char **, int, void *);
          extern long double strtold_l(const char *, char **, void *);
          extern size_t mbrtowc(wchar_t *, const char *, size_t, void *);
          extern size_t wcrtomb(char *, wchar_t, void *);
          __attribute__((visibility("default")))
          int JNI_OnLoad(void *vm,void *reserved){
            (void)vm;(void)reserved;
            volatile unsigned char marker=__sF[0];
            void *locale=newlocale(1,"C.UTF-8",0);
            char buf[8];
            wchar_t wc=0;
            char *end=0;
            int result=(locale!=0)+(setlocale(6,0)!=0)+
                (uselocale(locale)!=0)+(int)strtoll_l("17",&end,10,locale)+
                (int)strtoull_l("2",&end,10,locale)+
                (int)strtold_l("1.0",&end,locale)+
                (int)mbrtowc(&wc,"A",1,0)+(int)wcrtomb(buf,L'A',0);
            freelocale(locale);
            return result+marker;
          }
          EOF
          cc -shared -fPIC -O2 -fno-builtin -o /tmp/phase18_game.so /tmp/lenneth_phase18_mock.c
          mkdir -p assets saves
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase18_game.so /tmp/phase3_partner.so | tee lenneth-phase18-batch.txt
