name: Lenneth Android R36S - ARM64 phase11 synthetic execution and C++ ABI

on:
  workflow_dispatch:
  push:
    branches:
      - port/lenneth-android-r36s
    paths:
      - "lenneth-r36s/**"
      - ".github/workflows/lenneth-r36s.yml"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install native ARM64 SDL2 and GLESv2 headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libsdl2-dev libgles2-mesa-dev libegl-dev zip file binutils

      - name: Validate shell scripts
        run: |
          bash -n lenneth-r36s/PortMaster/lenneth-test-launcher.sh
          sh -n "lenneth-r36s/PortMaster/Lenneth Android R36S Test.sh"

      - name: Compile independent Linux ARM64 hardware test
        run: |
          cmake -S lenneth-r36s -B build-lenneth -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-lenneth -v -j 4
          file build-lenneth/lenneth-probe
          readelf -h build-lenneth/lenneth-probe | grep -q 'Machine:.*AArch64'

      - name: Verify read-only ELF audit using an ARM64 system executable
        run: |
          ./build-lenneth/lenneth-probe --inspect /usr/bin/true | tee lenneth-audit-test.txt
          grep -q 'machine=AArch64' lenneth-audit-test.txt
          grep -q 'NEEDED total=' lenneth-audit-test.txt
          if ./build-lenneth/lenneth-probe --inspect /etc/os-release; then
            echo "ERROR: invalid ELF was accepted"
            exit 1
          fi

      - name: Test AArch64 mapping and safe relocations with an original mock library
        run: |
          cat > /tmp/lenneth_stub.c <<'EOF'
          static int s_runtime_state = 42;
          void *s_native_refs[] = {&s_runtime_state, &s_native_refs};
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm, void *reserved) {
            (void)vm; (void)reserved; return s_runtime_state;
          }
          EOF
          cc -shared -fPIC -O2 -o /tmp/lenneth_mock.so /tmp/lenneth_stub.c
          ./build-lenneth/lenneth-probe --preflight /tmp/lenneth_mock.so | tee lenneth-preflight-test.txt
          grep -q 'preflight=PASS' lenneth-preflight-test.txt
          grep -Eq 'relative_applied=[1-9][0-9]*' lenneth-preflight-test.txt
          if ./build-lenneth/lenneth-probe --preflight /etc/os-release; then
            echo "ERROR: invalid ELF passed mapping preflight"
            exit 1
          fi

      - name: Test phase3 multi-library AArch64 linker without game files
        run: |
          cat > /tmp/lenneth_partner.c <<'EOF'
          __attribute__((visibility("default"))) int v1_shared_api(void) { return 42; }
          __attribute__((visibility("default"))) int v1_shared_global = 14;
          EOF
          cat > /tmp/lenneth_game.c <<'EOF'
          extern int v1_shared_api(void);
          extern int v1_shared_global;
          extern void glClear(unsigned int);
          static int private_value = 7;
          int *internal_ref = &private_value;
          int *imported_data = &v1_shared_global;
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm, void *r) {
            (void)vm; (void)r;
            glClear(0x4000u); /* unresolved GLES import only; never executed */
            return v1_shared_api() + *imported_data + *internal_ref;
          }
          EOF
          cc -shared -fPIC -O2 -o /tmp/phase3_partner.so /tmp/lenneth_partner.c
          cc -shared -fPIC -O2 -o /tmp/phase3_game.so /tmp/lenneth_game.c
          ./build-lenneth/lenneth-probe --link-plan /tmp/phase3_game.so /tmp/phase3_partner.so | tee lenneth-linkplan-test.txt
          grep -q 'PHASE3=PASS' lenneth-linkplan-test.txt
          grep -Eq 'cross_libcxx=[1-9][0-9]*' lenneth-linkplan-test.txt
          if ./build-lenneth/lenneth-probe --link-plan /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid game ELF passed linking preflight"
            exit 1
          fi

      - name: Test phase4 host GLES2/EGL symbol bindings without running game
        run: |
          ./build-lenneth/lenneth-probe --host-plan /tmp/phase3_game.so /tmp/phase3_partner.so | tee lenneth-hostplan-test.txt
          grep -q 'PHASE4=PASS' lenneth-hostplan-test.txt
          grep -Eq 'host_gles_slots=[1-9][0-9]*' lenneth-hostplan-test.txt
          grep -q 'GLESv2_provider=loaded' lenneth-hostplan-test.txt
          if ./build-lenneth/lenneth-probe --host-plan /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid game ELF was accepted by host plan"
            exit 1
          fi

      - name: Test phase5 conservative libc/libm ABI binding without commercial game
        run: |
          cat > /tmp/lenneth_portable_mock.c <<'EOF'
          #include <stddef.h>
          #include <stdlib.h>
          #include <string.h>
          #include <math.h>
          extern int v1_shared_api(void);
          static volatile double angle = 0.45;
          static volatile size_t length = 16;
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm, void *reserved) {
            (void)vm; (void)reserved;
            char buffer[64] = {0};
            char source[64] = {1,2,3};
            memcpy(buffer, source, length);
            void *p = malloc(123);
            if (p) { *((volatile char*)p) = buffer[0]; free(p); }
            return (int)sin(angle) + v1_shared_api();
          }
          EOF
          cc -shared -fPIC -O2 -fno-builtin -o /tmp/phase5_game.so /tmp/lenneth_portable_mock.c
          ./build-lenneth/lenneth-probe --portable-plan /tmp/phase5_game.so /tmp/phase3_partner.so | tee lenneth-portable-test.txt
          grep -q 'PHASE5=PASS' lenneth-portable-test.txt
          grep -Eq 'host_portable_slots=[1-9][0-9]*' lenneth-portable-test.txt
          grep -q 'libc_provider=loaded' lenneth-portable-test.txt
          grep -q 'libm_provider=loaded' lenneth-portable-test.txt
          if ./build-lenneth/lenneth-probe --portable-plan /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid ELF was accepted by portable provider"
            exit 1
          fi

      - name: Phase6 test standalone read-only AAsset bridge and ELF import binding
        run: |
          mkdir -p /tmp/lenneth-fixture/dir
          printf 'Synthetic Lenneth asset fixture\n' > /tmp/lenneth-fixture/fixture.txt
          printf 'Nested file\n' > /tmp/lenneth-fixture/dir/scene.txt
          ln -s /etc /tmp/lenneth-fixture/symlink-to-etc
          ./build-lenneth/lenneth-probe --asset-selftest /tmp/lenneth-fixture fixture.txt | tee lenneth-asset-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-asset-fixture.txt
          cat > /tmp/lenneth_asset_mock.c <<'EOF'
          #include <stddef.h>
          extern void *AAssetManager_fromJava(void *,void *);
          extern void *AAssetManager_open(void *,const char *,int);
          extern int AAsset_read(void *,void *,size_t);
          extern void AAsset_close(void *);
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *reserved) {
            (void)reserved;
            char data[20];
            void *m=AAssetManager_fromJava(vm,0);
            void *a=AAssetManager_open(m,"fixture.txt",2);
            if(!a)return -1;
            int r=AAsset_read(a,data,sizeof(data));
            AAsset_close(a);
            return r;
          }
          EOF
          cc -shared -fPIC -O2 -o /tmp/phase6_game.so /tmp/lenneth_asset_mock.c
          mkdir -p assets
          ./build-lenneth/lenneth-probe --asset-plan /tmp/phase6_game.so /tmp/phase3_partner.so | tee lenneth-assetplan-test.txt
          grep -q 'PHASE6=PASS' lenneth-assetplan-test.txt
          grep -Eq 'host_asset_slots=[1-9][0-9]*' lenneth-assetplan-test.txt
          if ./build-lenneth/lenneth-probe --asset-plan /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid ELF was accepted by AAsset provider plan"
            exit 1
          fi

      - name: Phase7 test NDK logging adapter and JNI symbol inventory
        run: |
          ./build-lenneth/lenneth-probe --logging-selftest | tee lenneth-logging-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-logging-fixture.txt
          cat > /tmp/lenneth_logging_mock.c <<'EOF'
          extern int __android_log_write(int, const char*, const char*);
          extern int __android_log_print(int, const char*, const char*, ...);
          extern void android_set_abort_message(const char *);
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *reserved) {
            (void)vm;(void)reserved;
            android_set_abort_message("fixture only");
            return __android_log_write(4,"probe","synthetic")+
                   __android_log_print(3,"probe","fixture %d",42);
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeInit(void *env,void *cls,int w,int h) {
            (void)env;(void)cls;(void)w;(void)h;
          }
          __attribute__((visibility("default"))) void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeRender(void *env,void *cls) {
            (void)env;(void)cls;
          }
          EOF
          cc -shared -fPIC -O2 -o /tmp/phase7_game.so /tmp/lenneth_logging_mock.c
          mkdir -p assets
          ./build-lenneth/lenneth-probe --logging-plan /tmp/phase7_game.so /tmp/phase3_partner.so | tee lenneth-logging-plan.txt
          grep -q 'PHASE7=PASS' lenneth-logging-plan.txt
          grep -Eq 'host_log_slots=[1-9][0-9]*' lenneth-logging-plan.txt
          grep -q 'bridge=JNI_OnLoad present=1 invoked=0' lenneth-logging-plan.txt
          grep -q 'Cocos2dxRenderer_nativeInit present=1 invoked=0' lenneth-logging-plan.txt
          if ./build-lenneth/lenneth-probe --logging-plan /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid ELF was accepted by logging preflight"
            exit 1
          fi

      - name: Phase8 one-run batch diagnostics (all providers + JNI + asset/log fixtures)
        run: |
          mkdir -p assets
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase7_game.so /tmp/phase3_partner.so | tee lenneth-batch-headless-test.txt
          grep -q 'BATCH_LINK=PASS single_mapping_pass=1' lenneth-batch-headless-test.txt
          grep -q 'SELFTEST=PASS' lenneth-batch-headless-test.txt
          grep -q 'bridge=JNI_OnLoad present=1 invoked=0' lenneth-batch-headless-test.txt
          grep -q 'FINAL=PASS' lenneth-batch-headless-test.txt
          grep -q 'Overall diagnostic: PASS' lenneth-suite-summary.txt
          grep -q 'GLES2/ALSA/gamepad environment: SKIPPED_CI' lenneth-suite-summary.txt
          test -s lenneth-blockers.tsv
          grep -q '^module' lenneth-blockers.tsv
          if ./build-lenneth/lenneth-probe --batch-headless /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: malformed ELF passed batch suite"
            exit 1
          fi

      - name: Phase9 test Bionic pthread guest-object shims and combined ARM64 resolver
        run: |
          ./build-lenneth/lenneth-probe --threads-selftest | tee lenneth-bionic-thread-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-bionic-thread-fixture.txt
          cat > /tmp/lenneth_thread_mock.c <<'EOF'
          /* Synthetic AArch64 Android-style imports. Code is NEVER executed by the linker. */
          extern int pthread_mutex_lock(void*);
          extern int pthread_mutex_unlock(void*);
          extern int pthread_mutex_init(void*,const void*);
          extern int pthread_cond_signal(void*);
          extern int pthread_cond_wait(void*,void*);
          extern void *pthread_getspecific(unsigned int);
          extern int pthread_setspecific(unsigned int,const void*);
          static int guest_mutex,guest_cond;
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *reserved){
            (void)vm;(void)reserved;
            int n=pthread_mutex_init(&guest_mutex,0);
            n+=pthread_mutex_lock(&guest_mutex);
            n+=pthread_cond_signal(&guest_cond);
            n+=pthread_setspecific(0,pthread_getspecific(0));
            n+=pthread_cond_wait(&guest_cond,&guest_mutex);
            n+=pthread_mutex_unlock(&guest_mutex);
            return n;
          }
          EOF
          cc -shared -fPIC -O2 -o /tmp/phase9_game.so /tmp/lenneth_thread_mock.c
          mkdir -p assets
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase9_game.so /tmp/phase3_partner.so | tee lenneth-phase9-batch-test.txt
          grep -q 'PHASE9_LINK=PASS' lenneth-phase9-batch-test.txt
          grep -q 'SELFTEST=PASS' lenneth-phase9-batch-test.txt
          grep -Eq 'host_thread_slots=[1-9][0-9]*' lenneth-phase9-batch-test.txt
          grep -q 'BATCH_LINK=PASS single_mapping_pass=1' lenneth-phase9-batch-test.txt
          grep -q 'FINAL=PASS' lenneth-phase9-batch-test.txt
          grep -q 'Bionic pthread/cond/TLS synthetic fixtures: PASS' lenneth-suite-summary.txt
          if ./build-lenneth/lenneth-probe --batch-headless /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid ELF passed phase9 batch"
            exit 1
          fi

      - name: Phase10 Bionic fortified libc and thread batch tests
        run: |
          ./build-lenneth/lenneth-probe --fortify-selftest | tee lenneth-fortify-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-fortify-fixture.txt
          cat > /tmp/lenneth_fortify_mock.c <<'EOF'
          #include <stddef.h>
          #include <sys/types.h>
          #include <stdarg.h>
          extern size_t __strlen_chk(const char*, size_t);
          extern void *__memcpy_chk(void*,const void*,size_t,size_t);
          extern ssize_t __read_chk(int,void*,size_t,size_t);
          extern int *__errno(void);
          extern int __open_2(const char*,int);
          extern int __vsnprintf_chk(char*,size_t,int,size_t,const char*,va_list);
          static int guest_errno_checked = 0;
          __attribute__((visibility("default")))
          int JNI_OnLoad(void *vm, void *reserved) {
            (void)vm; (void)reserved;
            char d[32]={0};
            const char *s="test";
            __memcpy_chk(d,s,5,sizeof(d));
            guest_errno_checked=*__errno();
            if(guest_errno_checked==1234)
              return (int)__read_chk(0,d,4,sizeof(d));
            if(guest_errno_checked==9876)
              return __open_2("/dev/null",0);
            return (int)__strlen_chk(d,sizeof(d));
          }
          EOF
          cc -shared -fPIC -O2 -fno-builtin -o /tmp/phase10_game.so /tmp/lenneth_fortify_mock.c
          mkdir -p assets
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase10_game.so /tmp/phase3_partner.so | tee lenneth-phase10-batch-test.txt
          grep -q 'PHASE10_LINK=PASS' lenneth-phase10-batch-test.txt
          grep -q 'SELFTEST=PASS' lenneth-phase10-batch-test.txt
          grep -Eq 'host_fortify_slots=[1-9][0-9]*' lenneth-phase10-batch-test.txt
          grep -q 'BATCH_LINK=PASS single_mapping_pass=1' lenneth-phase10-batch-test.txt
          grep -q 'FINAL=PASS' lenneth-phase10-batch-test.txt
          grep -q 'Bionic FORTIFY/errno synthetic fixtures: PASS' lenneth-suite-summary.txt
          if ./build-lenneth/lenneth-probe --batch-headless /etc/os-release /tmp/phase3_partner.so; then
            echo "ERROR: invalid ELF passed fortify batch"
            exit 1
          fi

      - name: Phase11 independent C++ ABI tests and first safe synthetic AArch64 code execution
        run: |
          ./build-lenneth/lenneth-probe --cxx-selftest | tee lenneth-cxx-test.txt
          grep -q 'SELFTEST=PASS' lenneth-cxx-test.txt

          # Original synthetic ELF pair: no game bytes, no Android bypass.
          # -nostdlib avoids startup objects/imports/constructors.
          cat > /tmp/lenneth_mock_partner.c <<'EOF'
          __attribute__((visibility("default")))
          const char lenneth_phase11_mock_marker[] =
              "LENNETH_PHASE11_SYNTHETIC_ONLY_2026";
          __attribute__((visibility("default")))
          int v1_shared_api(void) { return 37; }
          static int partner_state = 13;
          __attribute__((visibility("default")))
          int *partner_relative_fixup = &partner_state;
          EOF
          cat > /tmp/lenneth_mock_guest.c <<'EOF'
          __attribute__((visibility("default")))
          const char lenneth_phase11_mock_marker[] =
              "LENNETH_PHASE11_SYNTHETIC_ONLY_2026";
          extern int v1_shared_api(void);
          static int guest_state = 40;
          __attribute__((visibility("default")))
          int *guest_relative_fixup = &guest_state;
          __attribute__((visibility("default")))
          int JNI_OnLoad(void *vm, void *unused) {
              (void)vm;(void)unused;
              return v1_shared_api() + *guest_relative_fixup;
          }
          EOF
          cc -shared -nostdlib -fPIC -O2 -Wl,--no-undefined \
             -o /tmp/lenneth_mock_partner.so /tmp/lenneth_mock_partner.c
          cc -shared -nostdlib -fPIC -O2 \
             -o /tmp/lenneth_mock_guest.so /tmp/lenneth_mock_guest.c
          ./build-lenneth/lenneth-probe --execute-synthetic \
              /tmp/lenneth_mock_guest.so /tmp/lenneth_mock_partner.so | tee lenneth-synthetic-execution.txt
          grep -q 'EXECUTION=PASS' lenneth-synthetic-execution.txt
          grep -q 'returned=77 expected=77' lenneth-synthetic-execution.txt

          # A commercial ELF without both matching explicit test markers
          # must NEVER be eligible for code execution.
          if ./build-lenneth/lenneth-probe --execute-synthetic \
              /tmp/phase7_game.so /tmp/phase3_partner.so; then
            echo "ERROR: refused non-synthetic ELF was executed"
            exit 1
          fi

          mkdir -p assets
          ./build-lenneth/lenneth-probe --batch-headless \
              /tmp/phase10_game.so /tmp/phase3_partner.so | tee lenneth-phase11-batch.txt
          grep -q 'PHASE11_LINK=PASS' lenneth-phase11-batch.txt
          grep -q 'C++ destructor/thread lifecycle synthetic fixtures: PASS' lenneth-suite-summary.txt
          grep -q 'FINAL=PASS' lenneth-phase11-batch.txt

      - name: Package only open-source launcher and bootstrap
        run: |
          set -eu
          mkdir -p package/ports/lenneth-r36s/mock
          install -m755 build-lenneth/lenneth-probe package/ports/lenneth-r36s/lenneth-probe
          install -m644 /tmp/lenneth_mock_guest.so package/ports/lenneth-r36s/mock/synthetic_guest.so
          install -m644 /tmp/lenneth_mock_partner.so package/ports/lenneth-r36s/mock/synthetic_partner.so
          install -m755 lenneth-r36s/PortMaster/lenneth-test-launcher.sh package/ports/lenneth-r36s/launch.sh
          install -m755 "lenneth-r36s/PortMaster/Lenneth Android R36S Test.sh" "package/ports/Lenneth Android R36S Test.sh"
          install -m644 lenneth-r36s/README.md package/ports/lenneth-r36s/README.md
          install -m644 lenneth-r36s/LICENSE package/ports/lenneth-r36s/LICENSE
          test ! -e package/ports/lenneth-r36s/libMyGame.so
          test ! -e package/ports/lenneth-r36s/libRMS.so
          test ! -e package/ports/lenneth-r36s/assets
          (cd package && zip -qr ../lenneth-r36s-multitest-phase11-arm64.zip ports)
          sha256sum lenneth-r36s-multitest-phase11-arm64.zip
          ls -lh lenneth-r36s-multitest-phase11-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lenneth-Android-R36S-ARM64-Multitest-Phase11
          path: lenneth-r36s-multitest-phase11-arm64.zip
          if-no-files-found: error
          retention-days: 14
