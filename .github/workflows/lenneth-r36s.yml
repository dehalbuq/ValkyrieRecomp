          grep -q 'longjmp' lenneth-blockers.tsv
          grep -q 'FINAL=PASS' phase23-gate-denied.txt
      - name: Phase24 verify read-only startup metadata, JNI and ELF constructor inventory
        run: |
          set -euo pipefail
          ./build-lenneth/lenneth-probe --startup24-selftest | tee lenneth-phase24-selftest.txt
          grep -q 'SELFTEST=PASS' lenneth-phase24-selftest.txt
          grep -q 'filename_sanitization=PASS' lenneth-phase24-selftest.txt
          cat > /tmp/lenneth_phase24_mock.c <<'EOF'
          #include <stdio.h>
          static __thread int thread_local_fixture=9;
          static int constructor_count=0;
          __attribute__((constructor))
          static void initial_program_state(void){constructor_count=thread_local_fixture;}
          __attribute__((visibility("default")))
          int JNI_OnLoad(void *vm,void *reserved) {
            (void)vm;(void)reserved;
            puts("JNI fixture should never execute");
            return constructor_count;
          }
          __attribute__((visibility("default")))
          void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeInit(void *env,void *cls,int w,int h){
            (void)env;(void)cls;(void)w;(void)h;
          }
          __attribute__((visibility("default")))
          void Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeRender(void *env,void *cls){
            (void)env;(void)cls;
          }
          EOF
          cc -shared -fPIC -Wl,-z,relro -o /tmp/phase24_metadata.so /tmp/lenneth_phase24_mock.c
          ./build-lenneth/lenneth-probe --startup24 /tmp/phase24_metadata.so /tmp/phase3_partner.so | tee lenneth-phase24-startup.txt
          grep -q 'STARTUP_AUDIT=PASS startup_gate=BLOCKED' lenneth-phase24-startup.txt
          grep -q 'lenneth-startup-gates.tsv' lenneth-phase24-startup.txt
          grep -q 'DT_NEEDED' lenneth-startup-gates.tsv
          grep -q 'init_array_entries=' lenneth-startup-gates.tsv
          grep -q 'pt_tls=1' lenneth-startup-gates.tsv
          grep -q 'JNI_OnLoad=1 nativeInit=1 nativeRender=1' lenneth-startup-gates.tsv
          grep -q 'JNI_JAVA_VM.*BLOCKED' lenneth-startup-gates.tsv
          grep -q 'COMMERCIAL_ENGINE.*BLOCKED' lenneth-startup-gates.tsv
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase24_metadata.so /tmp/phase3_partner.so | tee lenneth-phase24-batch.txt
          grep -q 'STARTUP_AUDIT=PASS startup_gate=BLOCKED' lenneth-phase24-batch.txt
          grep -q 'Phase24 read-only private Android startup metadata: PASS' lenneth-suite-summary.txt
          grep -q 'FINAL=PASS' lenneth-phase24-batch.txt
          if ./build-lenneth/lenneth-probe --startup24 /etc/os-release /tmp/phase3_partner.so; then
            echo 'ERROR: non-ELF was accepted by startup scanner'
            exit 1
          fi
          if ./build-lenneth/lenneth-probe --batch-headless /etc/os-release /tmp/phase3_partner.so; then
            echo 'ERROR: malformed ELF accepted by previous linker'
            exit 1
          fi

      - name: Phase25 AArch64 constructor relocation and GLES1 fixed function inventory
        run: |
          set -euo pipefail
          ./build-lenneth/lenneth-probe --startup25-selftest | tee lenneth-phase25-selftest.txt
          grep -q 'SELFTEST=PASS' lenneth-phase25-selftest.txt
          grep -q 'fixed_function_classifier=PASS' lenneth-phase25-selftest.txt
          cat > /tmp/phase25_fakegles1.c <<'EOF'
          void glMatrixMode(unsigned int m){ (void)m; }
          EOF
          cc -shared -fPIC -Wl,-soname,libGLESv1_CM.so -o /tmp/libGLESv1_CM.so /tmp/phase25_fakegles1.c
          cat > /tmp/phase25_game.c <<'EOF'
          #include <stdint.h>
          extern void glMatrixMode(unsigned int);
          static void (*volatile imported_fixed)(unsigned int)=glMatrixMode;
          static int counter;
          __attribute__((constructor)) static void first(void){counter=1;}
          __attribute__((constructor)) static void second(void){counter+=2;}
          __attribute__((visibility("default"))) int JNI_OnLoad(void *vm,void *arg){
            (void)vm;(void)arg;
            return counter + (imported_fixed!=0);
          }
          EOF
          cc -shared -fPIC -Wl,-z,relro -Wl,--no-as-needed -L/tmp -o /tmp/phase25_game.so /tmp/phase25_game.c -lGLESv1_CM
          ./build-lenneth/lenneth-probe --startup25 /tmp/phase25_game.so /tmp/phase3_partner.so | tee lenneth-phase25-inventory.txt
          grep -q 'STARTUP_PLAN=PASS' lenneth-phase25-inventory.txt
          grep -q 'gles1_needed=1' lenneth-phase25-inventory.txt
          grep -Eq 'ctor_slots_total=[1-9][0-9]*' lenneth-phase25-inventory.txt
          grep -q 'fixed_function_imports=1' lenneth-phase25-inventory.txt
          grep -q 'GLES1_FIXED_FUNCTION_IMPORT.*glMatrixMode' lenneth-phase25-startup-plan.tsv
          grep -q 'CONSTRUCTOR_PLAN.*BLOCKED' lenneth-phase25-startup-plan.tsv
          grep -q 'GLES1_HOST_PROBE.*BLOCKED' lenneth-phase25-startup-plan.tsv
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase24_metadata.so /tmp/phase3_partner.so | tee lenneth-phase25-batch.txt
          grep -q 'STARTUP_PLAN=PASS' lenneth-phase25-batch.txt
          grep -q 'Phase25 private ELF constructors and OpenGL ES1 import plan: PASS' lenneth-suite-summary.txt
          grep -q 'FINAL=PASS' lenneth-phase25-batch.txt
          grep -q 'COMMERCIAL_ENGINE.*BLOCKED' lenneth-phase25-startup-plan.tsv
          if ./build-lenneth/lenneth-probe --startup25 /etc/os-release /tmp/phase3_partner.so; then
            echo 'ERROR: invalid ELF accepted in Phase25'
            exit 1
          fi
      - name: Phase26 test optional native GLES1 and fail-closed guest symbols
        run: |
          set -euo pipefail
          ./build-lenneth/lenneth-probe --gles1-probe26-selftest | tee lenneth-phase26-fixture.txt
          grep -q 'SELFTEST=PASS' lenneth-phase26-fixture.txt
          grep -q 'phase25_plan_parser=PASS' lenneth-phase26-fixture.txt
          mkdir -p /tmp/lenneth-phase26-full /tmp/lenneth-phase26-partial
          cat >/tmp/lenneth-phase26-full/es1.c <<'EOF'
          void glMatrixMode(unsigned int mode){(void)mode;}
          void glLoadIdentity(void){}
          void glVertexPointer(int n,unsigned int t,int stride,const void *p){
            (void)n;(void)t;(void)stride;(void)p;
          }
          void glEnableClientState(unsigned int state){(void)state;}
          EOF
          cc -shared -fPIC -Wl,-soname,libGLESv1_CM.so.1 \
             -o /tmp/lenneth-phase26-full/libGLESv1_CM.so.1 /tmp/lenneth-phase26-full/es1.c
          LD_LIBRARY_PATH=/tmp/lenneth-phase26-full \
            ./build-lenneth/lenneth-probe --gles1-probe26 /tmp/phase25_game.so /tmp/phase3_partner.so | tee phase26-complete.txt
          grep -q 'GLES1_PROBE=PASS' phase26-complete.txt
          grep -q 'gles1_available=1 essential_symbols=4/4' phase26-complete.txt
          grep -q 'game_needs_gles1=1 game_fixed_imports=1' phase26-complete.txt
          grep -q 'GLES1_EGL_CONTEXT.*NOT_TESTED' lenneth-gles1-runtime26.tsv
          grep -q 'GLES1_ENGINE_BINDING.*BLOCKED' lenneth-gles1-runtime26.tsv
          LD_LIBRARY_PATH=/tmp/lenneth-phase26-full \
            ./build-lenneth/lenneth-probe --ndk-dl-selftest | tee phase26-dloader.txt
          grep -q 'SELFTEST=PASS' phase26-dloader.txt
          cat >/tmp/lenneth-phase26-partial/es1.c <<'EOF'
          void glMatrixMode(unsigned int mode){(void)mode;}
          EOF
          cc -shared -fPIC -Wl,-soname,libGLESv1_CM.so.1 \
             -o /tmp/lenneth-phase26-partial/libGLESv1_CM.so.1 /tmp/lenneth-phase26-partial/es1.c
          LD_LIBRARY_PATH=/tmp/lenneth-phase26-partial \
            ./build-lenneth/lenneth-probe --gles1-probe26 /tmp/phase25_game.so /tmp/phase3_partner.so | tee phase26-partial.txt
          grep -q 'GLES1_PROBE=PASS' phase26-partial.txt
          grep -q 'gles1_available=1 essential_symbols=1/4' phase26-partial.txt
          grep -q 'glLoadIdentity.*MISSING' lenneth-gles1-runtime26.tsv
          LD_LIBRARY_PATH=/tmp/lenneth-phase26-full \
            ./build-lenneth/lenneth-probe --batch-headless /tmp/phase25_game.so /tmp/phase3_partner.so | tee phase26-batch.txt
          grep -q 'GLES1_PROBE=PASS' phase26-batch.txt
          grep -q 'gles1_available=1 essential_symbols=4/4' phase26-batch.txt
          grep -q 'Phase26 host GLES1 symbol availability without GL calls: PASS' lenneth-suite-summary.txt
          grep -q 'FINAL=PASS' phase26-batch.txt
          grep -q 'engine_executed=NO' phase26-batch.txt
          if ./build-lenneth/lenneth-probe --gles1-probe26 /etc/os-release /tmp/phase3_partner.so; then
            echo 'ERROR: malformed ELF accepted by Phase26'
            exit 1
          fi

      - name: Phase27 JNI Invocation ABI and isolated GLES1 context tests
        run: |
          set -euo pipefail
          ./build-lenneth/lenneth-probe --jni27-selftest | tee lenneth-phase27-jni.txt
          grep -q 'JNI_VM_SELFTEST=PASS' lenneth-phase27-jni.txt
          grep -q 'synthetic_JNI_OnLoad=PASS' lenneth-phase27-jni.txt
          grep -q 'thread_attach_detach=PASS' lenneth-phase27-jni.txt
          grep -q 'FindClass=DENIED' lenneth-phase27-jni.txt
          grep -q 'commercial_JNI_OnLoad=NOT_CALLED' lenneth-phase27-jni.txt
          ./build-lenneth/lenneth-probe --gles1-context27-selftest | tee lenneth-phase27-gles1-classifier.txt
          grep -q 'GLES1_CONTEXT_SELFTEST=PASS' lenneth-phase27-gles1-classifier.txt
          grep -q 'native_ES2_not_ES1=PASS' lenneth-phase27-gles1-classifier.txt
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            ./build-lenneth/lenneth-probe --gles1-context27 | tee lenneth-phase27-headless.txt
          grep -q 'GLES1_CONTEXT=UNAVAILABLE' lenneth-phase27-headless.txt
          grep -q 'EGL_ES1_CONTEXT.*UNAVAILABLE' lenneth-gles1-context27.tsv
          grep -q 'COMMERCIAL_ENGINE.*BLOCKED' lenneth-gles1-context27.tsv
          ./build-lenneth/lenneth-probe --batch-headless /tmp/phase25_game.so /tmp/phase3_partner.so | tee lenneth-phase27-batch.txt
          grep -q 'JNI_VM_SELFTEST=PASS' lenneth-phase27-batch.txt
          grep -q 'GLES1_CONTEXT_SELFTEST=PASS' lenneth-phase27-batch.txt
          grep -q 'Phase27 synthetic JavaVM/JNIEnv ABI and thread lifecycle: PASS' lenneth-suite-summary.txt
          grep -q 'Phase27 native GLES1 version classifier: PASS' lenneth-suite-summary.txt
          grep -q 'FINAL=PASS' lenneth-phase27-batch.txt
          grep -q 'engine_executed=NO' lenneth-phase27-batch.txt

      - name: Package only open-source launcher and bootstrap
        run: |
          set -eu
          mkdir -p package/ports/lenneth-r36s/mock
          install -m755 build-lenneth/lenneth-probe package/ports/lenneth-r36s/lenneth-probe
          install -m644 /tmp/lenneth_mock_guest.so package/ports/lenneth-r36s/mock/synthetic_guest.so
          install -m644 /tmp/lenneth_mock_partner.so package/ports/lenneth-r36s/mock/synthetic_partner.so
          install -m755 lenneth-r36s/PortMaster/lenneth-test-launcher.sh package/ports/lenneth-r36s/launch.sh
          install -m755 "lenneth-r36s/PortMaster/Lenneth Android R36S Test.sh" "package/ports/Lenneth Android R36S Test.sh"
          install -m644 lenneth-r36s/README.md package/ports/lenneth-r36s/README.md
          install -m644 lenneth-r36s/LICENSE package/ports/lenneth-r36s/LICENSE
          test ! -e package/ports/lenneth-r36s/libMyGame.so
          test ! -e package/ports/lenneth-r36s/libRMS.so
          test ! -e package/ports/lenneth-r36s/assets
          (cd package && zip -qr ../lenneth-r36s-multitest-phase27-arm64.zip ports)
          sha256sum lenneth-r36s-multitest-phase27-arm64.zip
          ls -lh lenneth-r36s-multitest-phase27-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lenneth-Android-R36S-ARM64-Multitest-Phase27
          path: lenneth-r36s-multitest-phase27-arm64.zip
          if-no-files-found: error
          retention-days: 14
